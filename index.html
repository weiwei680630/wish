<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0F4C81; overflow: hidden; color: #fff;
    font-family: 'LXGW WenKai TC', KaiTi, 'Microsoft JhengHei', serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; display: flex; gap: 10px;
    align-items: center; background: linear-gradient(transparent, rgba(20, 35, 50, .65)); transition: opacity .4s; }
  #bar.hide { opacity: 0; pointer-events: none; }
  button { font: inherit; font-size: 15px; color: #fff; background: rgba(255, 255, 255, .12);
    border: 1px solid rgba(255, 255, 255, .5); border-radius: 18px; padding: 5px 14px; cursor: pointer; }
  button:hover { background: rgba(255, 255, 255, .25); }
  #seek { flex: 1; accent-color: #fff; min-width: 80px; }
  #time, #shot { font-size: 14px; opacity: .85; white-space: nowrap; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; cursor: pointer;
    background: radial-gradient(circle at 50% 40%, #1C5B93, #0F4C81); }
  #start h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(32px, 4.5vw, 64px);
    margin: 0 24px; color: #fff; text-align: center; line-height: 1.2; }
  #start p { margin: 0; font-size: 22px; }
  #tap { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: rgba(20, 35, 50, .8);
    padding: 12px 22px; border-radius: 12px; text-align: center; font-size: 16px; line-height: 1.7; max-width: 92vw; }
  #tap b { font-size: 26px; }
  #panel { position: fixed; inset: 10% 15%; background: rgba(20, 35, 50, .94); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 10px; }
  #panel textarea { flex: 1; font-family: Consolas, monospace; font-size: 13px; background: #0e1a24; color: #dfe;
    border: none; border-radius: 8px; padding: 10px; resize: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<audio id="au" src="wish.mp3" preload="auto"></audio>

<div id="start">
  <h1>Wishing you happiness today, tomorrow, and always!</h1>
  <p>點一下開始播放</p>
  <p id="err" style="font-size:16px;opacity:.85"></p>
</div>

<div id="bar">
  <button id="playBtn">▶</button>
  <span id="time">0:00 / 0:00</span>
  <input id="seek" type="range" min="0" max="1000" value="0">
  <span id="shot"></span>
  <button id="tapBtn">打點校正</button>
  <button id="tblBtn">時間表</button>
  <button id="fsBtn">全螢幕</button>
</div>

<div id="tap" class="hidden"></div>

<div id="panel" class="hidden">
  <div>時間表（JSON）：已自動存在這台電腦的瀏覽器裡。可以複製保存，或貼上別的時間表後按「套用」。</div>
  <textarea id="json" spellcheck="false"></textarea>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button id="copyBtn">複製</button>
    <button id="applyBtn">套用</button>
    <button id="resetBtn">恢復預設</button>
    <button id="closeBtn">關閉</button>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 歌詞與段落（預估時間，可用「打點校正」改成精準時間）
// ============================================================
const SECTIONS = [
  { name: 'Intro', start: 0, end: 15, lines: [] },
  { name: 'Verse 1', start: 15, end: 50, lines: [
    '如果，否則，先把思路排好', '在亂數裡找規律，慢慢就看到方向', '每一個 for 迴圈', '都是往前一步的腳印',
    '縮排要對齊', '層次分明，心也就不慌', '當思緒卡住', '像霧把眼前都蓋上', '記住印出，記住呼吸', '它會替妳照亮'] },
  { name: 'Verse 2', start: 50, end: 95, lines: [
    '暴力解法不用怕', '由左到右，由上到下', '穩穩走，別急著跳', '一關一關把它拆下',
    '如果矩陣要翻轉', '座標在腦海裡打架', '就先閉上眼', '讓直覺先回答',
    '風怎麼吹，水怎麼流', '答案早在心裡發芽', '一步一步，照著做', '妳會把迷宮打開啊'] },
  { name: 'Chorus 1', start: 95, end: 125, lines: [
    '如果要重玩，就重設', '回到起點，不怕再來', '如果要繼續，就更新', '把每一格都安排好來',
    '如果多人對戰，先整理清單', '一個一個補上空白', '守住變數，守住節拍', '得分的瞬間就會到來'] },
  { name: 'Verse 3', start: 125, end: 170, lines: [
    '中級的戰場', '常常像一張大地圖', '有時要自己鋪路', '有時答案就在內建裡駐足',
    '資料處理別心急', '大和小，都慢慢讀', '字典，計數，映射', '是妳最穩的三個支柱',
    '考前把它們收進背包', '像把勇氣疊成一束', '妳不用完美', '只要把每步都做準確'] },
  { name: 'Bridge', start: 170, end: 200, lines: [
    '敲擊鍵盤的聲音', '一下一下，陪妳走', '映頤，先深呼吸', '看著螢幕，別回頭',
    '今天卡住的題目', '明天就會懂得更透', '妳寫下的每一行', '都在替未來鋪路'] },
  { name: 'Chorus 2', start: 200, end: 235, lines: [
    '如果要重玩，就重設', '回到起點，不怕再來', '如果要繼續，就更新', '把每一格都安排好來',
    '如果多人對戰，先整理清單', '一個一個補上空白', '守住變數，守住節拍', '得分的瞬間就會到來'] },
  { name: 'Outro', start: 235, end: 253, lines: [
    '耐心一行一行寫下', 'Bug 會慢慢退散開', '深呼吸，抬起頭來', '妳會順利過關，閃閃發亮'] },
];

const LYRICS = [];
SECTIONS.forEach((s, si) => {
  s.first = LYRICS.length;
  s.lines.forEach(text => LYRICS.push({ text, sec: si }));
});
// 每句歌詞的開始／結束秒數（依實際音檔整理）
const DEFAULT_TIMES = [17.4,22.9,29.9,31.9,36.5,38.9,43.6,46.1,50.9,54,57.5,61.6,65.3,67.9,72,75.3,78.6,81.4,85.7,89.6,92.4,96.2,99.8,103.5,106.9,110.3,113.7,117.8,120.9,124.7,130.6,132.7,134.8,137.9,144.5,147.2,149.2,151.8,157.9,161.1,165.3,167.5,172.1,176,179.5,182.9,186,189.8,193.4,196.8,200.3,204,207.4,210.7,214.1,218.2,221.2,224.9,231.2,234.7,238.3,242];
const DEFAULT_ENDS = [21.8,28.1,31.6,35.1,38.6,42.1,45.5,49,53.7,56,61,64.6,67.9,71.4,74.9,78.6,81,83.8,89,92.4,95.8,99.2,103.1,106.5,110.1,113.2,117.7,120.4,124.4,129,132.4,134.8,137.4,142.6,147.2,149,151.4,156.6,160.7,163.7,167.3,170.4,175.7,179.1,182.5,186,189.5,192.9,196.3,199.7,203.6,206.9,210.5,213.5,218,220.8,224.7,229.2,234.7,237.8,241.3,246.3];

const STORE_KEY = 'apcs-mv-timing-v2';
const DEFAULT_BPM = 88;
let TIMES = DEFAULT_TIMES.slice();
let ENDS = DEFAULT_ENDS.slice();
let BPM = DEFAULT_BPM;
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if (saved && Array.isArray(saved.times) && saved.times.length === LYRICS.length) TIMES = saved.times.map(Number);
  if (saved && Array.isArray(saved.ends) && saved.ends.length === LYRICS.length) ENDS = saved.ends.map(Number);
  if (saved && saved.bpm > 30 && saved.bpm < 240) BPM = +saved.bpm;
} catch (e) { /* 沒有存檔就用預設 */ }

function saveTiming() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ bpm: BPM, times: TIMES, ends: ENDS })); } catch (e) { /* 無法儲存時忽略 */ }
}

// ============================================================
// 基本工具
// ============================================================
const W = 1600, H = 900;
const INK = '#F7FBFF';
const DARK = '#1E262D';
const HAND = "'Caveat', 'LXGW WenKai TC', cursive";
const ZH = "'LXGW WenKai TC', 'Caveat', KaiTi, 'Microsoft JhengHei', serif";

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const ramp = (x, a, b) => clamp((x - a) / (b - a));
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const er = (x, a, b) => ease(ramp(x, a, b));
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function noise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(rnd(i), rnd(i + 1), u) * 2 - 1; }
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function mix(c1, c2, u) { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], u))).join(',')})`; }

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
let boil = 0;      // 線條「抖動」用的影格編號，做出手繪感
let curT = 0;      // 目前歌曲時間

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  offX = (cv.width - W * scale) / 2;
  offY = (cv.height - H * scale) / 2;
}
addEventListener('resize', resize);
resize();

// ---------- 點集合產生器 ----------
function seg(x1, y1, x2, y2, seed = 0) {
  const d = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.ceil(d / 10));
  const bow = (rnd(seed + .3) - .5) * d * .03, nx = -(y2 - y1) / (d || 1), ny = (x2 - x1) / (d || 1);
  const p = [];
  for (let i = 0; i <= n; i++) { const u = i / n, b = Math.sin(Math.PI * u) * bow; p.push([lerp(x1, x2, u) + nx * b, lerp(y1, y2, u) + ny * b]); }
  return p;
}
function poly(arr, seed = 0) { let out = []; for (let i = 0; i < arr.length - 1; i++) { const s = seg(arr[i][0], arr[i][1], arr[i + 1][0], arr[i + 1][1], seed + i); out = out.concat(i ? s.slice(1) : s); } return out; }
function rectP(x, y, w, h, s = 0) { return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y - 2]], s); }
function ellP(cx, cy, rx, ry, a0 = -Math.PI / 2, turn = 1.04, rot = 0) {
  const n = Math.max(12, Math.ceil((rx + ry) * turn * .6)), p = [], c = Math.cos(rot), s = Math.sin(rot);
  for (let i = 0; i <= n; i++) { const a = a0 + i / n * turn * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry; p.push([cx + x * c - y * s, cy + x * s + y * c]); }
  return p;
}
function crv(ctrl, per = 8) { // Catmull-Rom 曲線
  const p = [];
  for (let i = 0; i < ctrl.length - 1; i++) {
    const p0 = ctrl[i - 1] || ctrl[i], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[i + 2] || p2;
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / per));
    for (let j = i ? 1 : 0; j <= n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      p.push([0, 1].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  return p;
}
function along(pts, u) {
  const Ls = [0];
  for (let i = 1; i < pts.length; i++) Ls.push(Ls[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tg = Ls[Ls.length - 1] * clamp(u);
  let i = 1; while (i < pts.length - 1 && Ls[i] < tg) i++;
  const a = pts[i - 1], b = pts[i], f = clamp((tg - Ls[i - 1]) / ((Ls[i] - Ls[i - 1]) || 1));
  return { x: lerp(a[0], b[0], f), y: lerp(a[1], b[1], f), a: Math.atan2(b[1] - a[1], b[0] - a[0]) };
}

// ---------- 手繪筆觸 ----------
// pts：點集合；prog：畫到幾成（0~1）；o：{w 線寬, c 顏色, a 透明度, j 抖動, single 單筆, dash 虛線, seed}
function S(pts, prog = 1, o = {}) {
  prog = clamp(prog);
  if (prog <= 0 || !pts || pts.length < 2) return;
  const L = [0];
  for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = L[L.length - 1] * prog, w = o.w || 3, seed = (o.seed || 0) * 13.7;
  ctx.strokeStyle = o.c || INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (o.dash) { ctx.setLineDash(o.dash); ctx.lineDashOffset = o.dashOff || 0; }
  const ga = ctx.globalAlpha;
  for (let pass = 0; pass < (o.single ? 1 : 2); pass++) {
    const amp = (o.j ?? 1.2) * (pass ? 1.8 : 1), bs = seed + boil * 3.1 + pass * 17;
    ctx.beginPath();
    for (let i = 0; i < pts.length; i++) {
      let x = pts[i][0], y = pts[i][1];
      const over = L[i] > tot;
      if (over) { const a = pts[i - 1], f = (tot - L[i - 1]) / ((L[i] - L[i - 1]) || 1); x = lerp(a[0], x, f); y = lerp(a[1], y, f); }
      x += noise(bs + i * .23) * amp; y += noise(bs + 50 + i * .23) * amp;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      if (over) break;
    }
    ctx.lineWidth = pass ? w * .5 : w;
    ctx.globalAlpha = ga * (pass ? .5 : 1) * (o.a ?? 1);
    ctx.stroke();
  }
  ctx.globalAlpha = ga;
  if (o.dash) { ctx.setLineDash([]); ctx.lineDashOffset = 0; }
}
function F(pts, fill) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function alpha(a, fn) { const ga = ctx.globalAlpha; ctx.globalAlpha = ga * clamp(a); if (a > 0) fn(); ctx.globalAlpha = ga; }

// ---------- 手寫字（逐字寫出） ----------
function T(s, x, y, size, prog = 1, o = {}) {
  prog = clamp(prog); if (prog <= 0) return;
  const chars = [...s];
  ctx.font = `${o.wt || 400} ${size}px ${o.f || ZH}`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = o.c || INK;
  const full = ctx.measureText(s).width;
  const x0 = o.al === 'left' ? x : o.al === 'right' ? x - full : x - full / 2;
  const n = chars.length * prog, k = Math.floor(n), ga = ctx.globalAlpha, a = o.a ?? 1;
  const vis = chars.slice(0, k).join('');
  ctx.globalAlpha = ga * a; ctx.fillText(vis, x0, y);
  if (k < chars.length) { ctx.globalAlpha = ga * a * (n - k); ctx.fillText(chars[k], x0 + ctx.measureText(vis).width, y + (1 - (n - k)) * 5); }
  ctx.globalAlpha = ga;
}

// ============================================================
// 圖形元件：音符、星星、鋼琴、鍵盤、鯨魚……
// ============================================================
const CLEF = (() => {
  const p = [];
  for (let i = 0; i <= 30; i++) { const a = Math.PI * .5 + i / 30 * Math.PI * 2.3, r = .05 + i / 30 * .3; p.push([Math.cos(a) * r * .9, .35 + Math.sin(a) * r]); }
  p.push([.2, .05], [.12, -.45], [.02, -.85], [-.12, -.72], [-.04, -.4], [.07, .2], [.1, .9], [.0, 1.02], [-.12, .92]);
  return crv(p, .04);
})();

const noteKind = x => x < .45 ? 0 : x < .9 ? 1 : 2;
function note(x, y, s, kind, o = {}) {
  const c = DARK; // 所有音符一律黑色
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.r || 0); ctx.globalAlpha *= clamp(o.a ?? 1);
  const head = (hx, hy) => { ctx.beginPath(); ctx.ellipse(hx, hy, s * .32, s * .22, -.45, 0, 7); ctx.fillStyle = c; ctx.fill(); };
  const so = { c, w: Math.max(1.5, s * .08), single: true, j: .4 };
  if (kind === 0) {
    head(0, 0); S(seg(s * .28, -s * .05, s * .28, -s * 1.1), 1, so);
    S(crv([[s * .28, -s * 1.1], [s * .62, -s * .8], [s * .55, -s * .42]], 3), 1, so);
  } else if (kind === 1) {
    head(0, 0); head(s * .8, -s * .18);
    S(seg(s * .28, -s * .05, s * .28, -s * 1.1), 1, so); S(seg(s * 1.08, -s * .23, s * 1.08, -s * 1.28), 1, so);
    S(seg(s * .28, -s * 1.1, s * 1.08, -s * 1.28), 1, { ...so, w: s * .16 });
  } else {
    S(CLEF.map(([a, b]) => [a * s * .9, b * s * .9]), 1, { ...so, w: Math.max(1.5, s * .07) });
  }
  ctx.restore();
}

function spark(x, y, r, o = {}) {
  const so = { c: o.c || INK, w: o.w || 2, single: true, j: .3 };
  alpha(o.a ?? 1, () => {
    S(seg(x - r, y, x + r, y), 1, so); S(seg(x, y - r, x, y + r), 1, so);
    const q = r * .4; S(seg(x - q, y - q, x + q, y + q), 1, { ...so, w: so.w * .6 }); S(seg(x - q, y + q, x + q, y - q), 1, { ...so, w: so.w * .6 });
  });
}

// 飄浮的塗鴉音符（只依時間計算，可任意快轉）
function noteField(t, o) {
  for (let i = 0; i < o.n; i++) {
    const sd = (o.seed || 0) + i * 7.3, sp = (o.speed || 25) * (.6 + rnd(sd) * .8), life = o.h / sp;
    const ph = ((t + rnd(sd + 1) * life) % life) / life;
    const x = o.x + rnd(sd + 2) * o.w + Math.sin(t * .8 + i) * 12, y = o.y + o.h * (1 - ph);
    note(x, y, (o.size || 26) * (.7 + rnd(sd + 3) * .6), noteKind(rnd(sd + 4)), { a: Math.sin(Math.PI * ph) * (o.a ?? 1), c: o.c, r: Math.sin(t + i) * .2 });
  }
}

// 音符與星星爆開
function burst(cx, cy, el, o = {}) {
  const life = o.life || 2.6;
  if (el < 0 || el > life) return;
  const n = o.n || 20;
  for (let i = 0; i < n; i++) {
    const sd = (o.seed || 0) + i * 3.1, ang = -Math.PI / 2 + (rnd(sd) - .5) * (o.spread || Math.PI * 1.7);
    const v = (o.v || 520) * (.35 + rnd(sd + 1) * .8);
    const x = cx + Math.cos(ang) * v * el, y = cy + Math.sin(ang) * v * el + 260 * el * el, a = 1 - el / life;
    if (rnd(sd + 2) < .5) note(x, y, 22 + rnd(sd + 3) * 16, noteKind(rnd(sd + 6)), { a, c: o.c, r: el * 3 * (rnd(sd + 4) - .5) });
    else spark(x, y, 8 + rnd(sd + 5) * 12, { a });
  }
}

const BLACK_AFTER = [1, 1, 0, 1, 1, 1, 0];
function hatchRect(x, y, w, h, seed, press = 0) {
  if (h <= 1) return;
  const pts = rectP(x, y, w, h, seed);
  ctx.beginPath();

const MZ = (() => {
  const C = 11, R = 5, cs = 88, x0 = 800 - C * cs / 2, y0 = 390 - R * cs / 2, r = mulberry(7);
  const right = [...Array(R)].map(() => Array(C).fill(true)), down = [...Array(R)].map(() => Array(C).fill(true));
  const vis = [...Array(R)].map(() => Array(C).fill(false)), st = [[0, 0]];
  vis[0][0] = true;
  while (st.length) {
    const [y, x] = st[st.length - 1];
    const nb = [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]].filter(([a, b]) => a >= 0 && a < R && b >= 0 && b < C && !vis[a][b]);
    if (!nb.length) { st.pop(); continue; }
    const [ny, nx] = nb[Math.floor(r() * nb.length)];
    if (ny > y) down[y][x] = false; else if (ny < y) down[ny][nx] = false; else if (nx > x) right[y][x] = false; else right[ny][nx] = false;
    vis[ny][nx] = true; st.push([ny, nx]);
  }
  const Wl = [], P = (a, b, c, d) => Wl.push(seg(a, b, c, d, Wl.length));
  for (let x = 0; x < C; x++) P(x0 + x * cs, y0, x0 + (x + 1) * cs, y0);
  for (let y = 1; y < R; y++) P(x0, y0 + y * cs, x0, y0 + (y + 1) * cs);
  for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) {
    if (down[y][x]) P(x0 + x * cs, y0 + (y + 1) * cs, x0 + (x + 1) * cs, y0 + (y + 1) * cs);
    if (right[y][x] && !(x === C - 1 && y === R - 1)) P(x0 + (x + 1) * cs, y0 + y * cs, x0 + (x + 1) * cs, y0 + (y + 1) * cs);
  }

  const key = (y, x) => y * C + x, prev = { 0: -1 }, q = [[0, 0]];

    if (x > 0 && !right[y][x - 1]) nbs.push([y, x - 1]);

    if (y > 0 && !down[y - 1][x]) nbs.push([y - 1, x]);

  return { W: Wl, exit, path, ex: x0 + C * cs, ey: y0 + (R - .5) * cs };
})();

// 每個字母一個隨機顏色，每 0.4 秒換一次
function rainbowText(s, x, y, size, prog, t, a = 1) {
  prog = clamp(prog); if (prog <= 0 || a <= 0) return;
  const chars = [...s], n = chars.length * prog, k = Math.floor(n), tick = Math.floor(t / .4);
  ctx.font = `700 ${size}px ${HAND}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let cx = x - ctx.measureText(s).width / 2;
  const ga = ctx.globalAlpha;
  chars.forEach((ch, i) => {
    const w = ctx.measureText(ch).width;
    if (i <= k && ch !== ' ') {
      ctx.globalAlpha = ga * a * (i < k ? 1 : n - k);
      ctx.fillStyle = `hsl(${Math.floor(rnd(i * 7.7 + tick * 13.1) * 360)}, 85%, 65%)`;
      ctx.fillText(ch, cx, y + Math.sin(t * 4 + i * .6) * 4);
    }
    cx += w;
  });
  ctx.globalAlpha = ga;
}

function fireworks(age, len) {
  if (age < 0 || age > len + 2) return;
  const shells = 16, sb = ctx.shadowBlur; ctx.shadowBlur = 0;
  for (let i = 0; i < shells; i++) {
    const t0 = i / shells * (len - .6), a = age - t0; if (a < 0 || a > 2.6) continue;
    const bx = 180 + rnd(i * 3.7) * 1240, by = 130 + rnd(i * 5.3) * 300, hue = Math.floor(rnd(i * 9.1) * 360), col = `hsl(${hue}, 85%, 58%)`;
    if (a < .6) { // 往上飛
      const u = a / .6, y = lerp(900, by, 1 - (1 - u) * (1 - u));
      ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + 40); ctx.stroke();
      continue;
    }
    const b = a - .6, n = 34, fade = 1 - b / 2;
    ctx.globalAlpha = clamp(fade); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let j = 0; j < n; j++) {
      const ang = j / n * Math.PI * 2 + rnd(i + j), v = 190 + rnd(i * 2 + j) * 60;
      const r1 = v * (1 - Math.exp(-b * 2.2)), r0 = v * (1 - Math.exp(-Math.max(0, b - .12) * 2.2)), gy = 40 * b * b;
      ctx.moveTo(bx + Math.cos(ang) * r0, by + Math.sin(ang) * r0 + gy);
      ctx.lineTo(bx + Math.cos(ang) * r1, by + Math.sin(ang) * r1 + gy);
    }
    ctx.stroke();
    ctx.fillStyle = `hsl(${(hue + 40) % 360}, 90%, 70%)`;
    for (let j = 0; j < n; j += 3) {
      const ang = j / n * Math.PI * 2 + rnd(i + j), r = (190 + rnd(i * 2 + j) * 60) * (1 - Math.exp(-b * 2.2)) * .7;
      ctx.beginPath(); ctx.arc(bx + Math.cos(ang) * r, by + Math.sin(ang) * r + 40 * b * b, 3, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.shadowBlur = sb;
}

  { at: 61, n: 33, name: '映頤，祝生日快樂', f: sFinale },
];

// ============================================================
// 背景、字幕、節拍
// ============================================================
const SEC_LEVEL = [.05, 0, .05, .55, .15, null, .8, null];
function secStart(i) { return i === 0 ? 0 : TIMES[SECTIONS[i].first] - .8; }
function secLevel(i, t) {
  if (i === 5) return lerp(.15, .72, er(t, TIMES[46] - .5, TIMES[48] + 1));
  if (i === 7) return lerp(.85, 1, ramp(t, TIMES[58], TIMES[61]));
  return SEC_LEVEL[i];
}
function bgLevel(t) {
  let s = 0;
  for (let i = 0; i < SECTIONS.length; i++) if (t >= secStart(i)) s = i;
  let v = secLevel(s, t);
  const st = secStart(s);
  if (s > 0 && t - st < 2.5) v = lerp(secLevel(s - 1, t), v, ease((t - st) / 2.5));
  return v;
}
function drawBg(t) {
  const b = bgLevel(t), w = cv.width, h = cv.height;
  const gr = ctx.createRadialGradient(w * .5, h * .38, 0, w * .5, h * .38, Math.max(w, h) * .75);
  // 背景 #0F4C81；副歌、結尾時中心稍微提亮
  gr.addColorStop(0, mix('#1C5B93', '#3A7AB5', b)); gr.addColorStop(1, '#0F4C81');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
  return b;
}
function beatInfo(t) { const x = (t - TIMES[22]) / (60 / BPM), n = Math.floor(x), ph = x - n; return { n: ((n % 4) + 4) % 4, ph, pulse: Math.exp(-ph * 5) }; }
function lineAt(t) { let i = -1; for (let k = 0; k < TIMES.length; k++) if (TIMES[k] <= t) i = k; return i; }
function subtitle(t, b) {
  const i = lineAt(t); if (i < 0) return;
  const st = TIMES[i], en = Math.min(TIMES[i + 1] ?? Infinity, (ENDS[i] ?? st + 7) + .3, songEnd());
  if (t > en) return;
  const a = Math.min(1, (t - st) / .3, (en - t) / .4);
  T(LYRICS[i].text, 800, 840, 46, ramp(t, st, st + .6), { a, c: INK });
}

// ============================================================
// 播放控制
// ============================================================
const au = document.getElementById('au');
let audioOK = true, fakeT = 0, fakePlaying = false, lastNow = performance.now();
au.addEventListener('error', () => {
  audioOK = false;
  document.getElementById('err').textContent = '找不到 wish.mp3：請把音檔和 index.html 放在同一個資料夾（目前會無聲播放畫面）';
});
function songEnd() { return audioOK && isFinite(au.duration) && au.duration > 0 ? au.duration : 264; }
function getT() { return audioOK ? au.currentTime : fakeT; }
function setT(x) { x = clamp(x, 0, songEnd()); if (audioOK) au.currentTime = x; else fakeT = x; }
function isPlaying() { return audioOK ? !au.paused : fakePlaying; }
function playP() { if (audioOK) au.play().catch(() => { audioOK = false; fakePlaying = true; }); else fakePlaying = true; }
function pauseP() { if (audioOK) au.pause(); else fakePlaying = false; }

function shotAt(t) {
  let idx = 0;
  for (let i = 0; i < SHOTS.length; i++) { const s = SHOTS[i].at < 0 ? 0 : TIMES[SHOTS[i].at]; if (t >= s) idx = i; }
  return idx;
}

function frame(now) {
  if (!audioOK && fakePlaying) { fakeT = Math.min(songEnd(), fakeT + (now - lastNow) / 1000); if (fakeT >= songEnd()) fakePlaying = false; }
  lastNow = now;
  const t = getT();
  curT = t; boil = Math.floor(now / 120);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.shadowColor = 'transparent';
  const b = drawBg(t);
  ctx.setTransform(scale, 0, 0, scale, offX, offY);
  ctx.shadowColor = 'rgba(30,55,80,.35)'; ctx.shadowBlur = 4 * scale;

  const si = shotAt(t), sh = SHOTS[si];
  const start = sh.at < 0 ? 0 : TIMES[sh.at];
  const nextStart = si + 1 < SHOTS.length ? TIMES[SHOTS[si + 1].at] : songEnd();
  const dur = Math.max(.5, nextStart - start), el = clamp(t - start, 0, dur);
  const lineRel = k => { const x = TIMES[sh.at + k]; return x !== undefined && sh.at >= 0 ? x - start : dur * k / 2; };
  const half = clamp(lineRel(1), .5, Math.max(.5, dur - .5));
  const g = { t, el, dur, v: sh.v || 1, line: lineRel, half, beat: beatInfo(t) };
  const last = si === SHOTS.length - 1;
  const fade = Math.min(1, el / .35, last ? 1 : (dur - el) / .35);
  ctx.save(); ctx.globalAlpha = clamp(fade);
  try { sh.f(g); } catch (err) { console.error(sh.name, err); }
  ctx.restore();
  if (!g.hideSub) subtitle(t, b);

  updateUI(t, sh);
  requestAnimationFrame(frame);
}

// ---------- 介面 ----------
const $ = id => document.getElementById(id);
const bar = $('bar'), seek = $('seek'), tapBox = $('tap'), panel = $('panel'), json = $('json');
let seeking = false, hideTimer = 0, forceHide = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function updateUI(t, sh) {
  $('playBtn').textContent = isPlaying() ? '❚❚' : '▶';
  $('time').textContent = `${fmt(t)} / ${fmt(songEnd())}`;
  $('shot').textContent = `#${sh.n} ${sh.name}`;
  if (!seeking) seek.value = Math.round(t / songEnd() * 1000);
  if (tap.on) renderTap();
}
function showBar() {
  if (forceHide) return;
  bar.classList.remove('hide'); clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if (isPlaying() && !tap.on) bar.classList.add('hide'); }, 2500);
}
addEventListener('mousemove', showBar);

$('start').addEventListener('click', () => { $('start').classList.add('hidden'); playP(); showBar(); });
$('playBtn').onclick = () => isPlaying() ? pauseP() : playP();
seek.addEventListener('input', () => { seeking = true; setT(seek.value / 1000 * songEnd()); });
seek.addEventListener('change', () => { seeking = false; });
$('fsBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

// ---------- 時間表面板 ----------
function openPanel() { json.value = JSON.stringify({ bpm: BPM, times: TIMES.map(x => +x.toFixed(2)), ends: ENDS.map(x => +x.toFixed(2)) }, null, 1); panel.classList.remove('hidden'); }
$('tblBtn').onclick = openPanel;
$('closeBtn').onclick = () => panel.classList.add('hidden');
$('copyBtn').onclick = () => {
  json.select();
  if (navigator.clipboard) navigator.clipboard.writeText(json.value).catch(() => document.execCommand('copy'));
  else document.execCommand('copy');
};
$('applyBtn').onclick = () => {
  try {
    const d = JSON.parse(json.value);
    if (!Array.isArray(d.times) || d.times.length !== LYRICS.length) throw new Error(`times 需要 ${LYRICS.length} 個數字`);
    TIMES = d.times.map(Number); if (d.bpm) BPM = +d.bpm;
    if (Array.isArray(d.ends) && d.ends.length === LYRICS.length) ENDS = d.ends.map(Number);
    saveTiming(); panel.classList.add('hidden');
  } catch (e) { json.value = '格式錯誤：' + e.message + '\n\n' + json.value; }
};
$('resetBtn').onclick = () => { TIMES = DEFAULT_TIMES.slice(); ENDS = DEFAULT_ENDS.slice(); BPM = DEFAULT_BPM; try { localStorage.removeItem(STORE_KEY); } catch (e) { } openPanel(); };

// ---------- 打點校正 ----------
const tap = { on: false, i: 0, taps: [] };
function renderTap() {
  const next = LYRICS[tap.i];
  tapBox.innerHTML = `打點校正（${tap.i} / ${LYRICS.length}）　${fmt(getT())}<br>` +
    (next ? `聽到這句開始時按 <b>空白鍵</b>：<br><b>「${next.text}」</b>` : '<b>完成！</b>') +
    `<br><small>Backspace 復原上一句｜跟著拍子連按 T 量拍速（目前 ${BPM} BPM）｜Esc 結束並儲存</small>`;
}
function enterTap() {
  panel.classList.add('hidden'); $('start').classList.add('hidden');
  tap.on = true; tap.i = 0; tap.taps = [];
  tapBox.classList.remove('hidden'); setT(0); playP(); renderTap();
}
function finishTap() { tap.on = false; tapBox.classList.add('hidden'); saveTiming(); openPanel(); }
function markLine() {
  const now = getT(), delta = now - TIMES[tap.i];
  for (let j = tap.i; j < TIMES.length; j++) { TIMES[j] += delta; ENDS[j] += delta; } // 後面的句子一起平移，畫面保持順序
  TIMES[tap.i] = now; tap.i++;
  if (tap.i >= LYRICS.length) finishTap();
}
$('tapBtn').onclick = enterTap;

addEventListener('keydown', e => {
  if (e.target === json) return;
  if (tap.on) {
    if (e.code === 'Space') { e.preventDefault(); markLine(); }
    else if (e.code === 'Backspace') { e.preventDefault(); if (tap.i > 0) { tap.i--; setT(Math.max(0, TIMES[tap.i] - 3)); } }
    else if (e.code === 'KeyT') {
      tap.taps.push(performance.now()); tap.taps = tap.taps.slice(-9);
      if (tap.taps.length >= 4) { const d = (tap.taps[tap.taps.length - 1] - tap.taps[0]) / (tap.taps.length - 1); BPM = Math.round(60000 / d); }
    } else if (e.code === 'Escape') finishTap();
    return;
  }
  if (e.code === 'Space') { e.preventDefault(); $('start').classList.add('hidden'); isPlaying() ? pauseP() : playP(); }
  else if (e.code === 'ArrowRight') setT(getT() + 5);
  else if (e.code === 'ArrowLeft') setT(getT() - 5);
  else if (e.code === 'KeyH') { forceHide = !forceHide; bar.classList.toggle('hide', forceHide); }
  else if (e.code === 'KeyF') $('fsBtn').click();
  showBar();
});

// 預覽用：index.html#still=120 會停在第 120 秒的畫面（不播音樂、不顯示控制列）
const still = /still=([\d.]+)/.exec(location.hash);
if (still) {
  audioOK = false; fakeT = +still[1];
  $('start').classList.add('hidden'); forceHide = true; bar.classList.add('hide');
}

requestAnimationFrame(frame);
</script>
</body>
</html>
